name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      # One browser project per job, on its own separate runner VM — true
      # parallelism with zero shared resource contention between browsers,
      # unlike running all 3 projects on one machine (see playwright.config.ts
      # for the local contention this avoids).
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    # Allure's report generator is Java-based — allure-playwright itself
    # needs no JVM (writes raw results), but `allure generate` does.
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browser (${{ matrix.project }})
      run: npx playwright install --with-deps ${{ matrix.project }}
    - name: Run Playwright tests (${{ matrix.project }})
      run: npx playwright test --project=${{ matrix.project }}
      env:
        BASE_URL: ${{ secrets.BASE_URL }}
        API_BASE_URL: ${{ secrets.API_BASE_URL }}
        TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
        TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

    - name: Generate Allure report
      if: ${{ !cancelled() }}
      run: npx allure generate allure-results --clean -o allure-report

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-${{ matrix.project }}
        path: playwright-report/
        retention-days: 30

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: allure-report-${{ matrix.project }}
        path: allure-report/
        retention-days: 30

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: junit-results-${{ matrix.project }}
        path: reports/junit-results.xml
        retention-days: 30